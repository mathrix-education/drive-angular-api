<h2>échecs</h2>
<ng-content *ngTemplateOutlet="requests; context: {requests: urlCatcher.failedRequests}"></ng-content>
<h2>succès</h2>
<ng-content *ngTemplateOutlet="requests; context: {requests: urlCatcher.successRequests}"></ng-content>


<ng-template #requests let-requests="requests">
  <div class="urls" [ngClass]="{right: item.status === 200, wrong: item.status !== 200}" *ngFor="let item of requests">
  <span>
    <span class="method">{{item.method}}</span>
    {{item.url}}
  </span>

    <span>
    <span class="mr-2">{{item.timeout}} ms</span>
      {{item.status}}</span>
  </div>
</ng-template>
